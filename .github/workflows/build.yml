name: Build Installers

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # lets you trigger a build manually from GitHub's UI

jobs:
  # ── Windows installer ────────────────────────────────────────────────────────
  build-windows:
    name: Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build + package
        run: npm run package:win

      - name: Build installer package
        run: node scripts/build-installer.js
        # skip the package:win step inside build-installer since we just ran it
        env:
          SKIP_PACKAGE: "1"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Greek-Flashcards-Windows
          path: dist/installer/
          retention-days: 30

  # ── Mac DMG ──────────────────────────────────────────────────────────────────
  build-mac:
    name: Mac DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build + package + create DMG
        run: |
          chmod +x scripts/build-mac.sh
          ./scripts/build-mac.sh

      - name: Upload Mac DMG
        uses: actions/upload-artifact@v4
        with:
          name: Greek-Flashcards-Mac
          path: dist/mac-installer/Greek Flashcards.dmg
          retention-days: 30
