name: Build Installers + Deploy PWA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ── Windows installer ────────────────────────────────────────────────────────
  build-windows:
    name: Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build + package
        run: npm run package:win
        env:
          PUBLIC_URL: "."

      - name: Build installer package
        run: node scripts/build-installer.js
        env:
          SKIP_PACKAGE: "1"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Greek-Flashcards-Windows
          path: dist/installer/
          retention-days: 30

  # ── Mac DMG ──────────────────────────────────────────────────────────────────
  build-mac:
    name: Mac DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build
        env:
          PUBLIC_URL: "."

      - name: Package with electron-packager
        run: |
          npx electron-packager . "Greek Flashcards" \
            --platform=darwin \
            --arch=arm64 \
            --out=dist \
            --overwrite \
            --ignore=src \
            --ignore="node_modules/.cache" \
            --ignore=.git \
            --ignore=scripts \
            --app-bundle-id=com.greek.flashcards \
            --app-version=1.0.0

      - name: Create DMG
        run: |
          APP="dist/Greek Flashcards-darwin-arm64/Greek Flashcards.app"
          mkdir -p dist/mac-installer
          STAGING=$(mktemp -d)
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "Greek Flashcards" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "dist/mac-installer/Greek Flashcards.dmg"
          rm -rf "$STAGING"

      - name: Upload Mac DMG
        uses: actions/upload-artifact@v4
        with:
          name: Greek-Flashcards-Mac
          path: "dist/mac-installer/Greek Flashcards.dmg"
          retention-days: 30

  # ── GitHub Pages PWA deployment ──────────────────────────────────────────────
  deploy-pwa:
    name: Deploy PWA to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate PWA icons
        run: |
          sudo apt-get install -y librsvg2-bin
          node scripts/generate-icons.js

      - name: Fix CSV encoding + set homepage
        run: |
          node -e "
            const fs = require('fs');
            // Re-encode CSV: strip any CRLF introduced by Windows git, ensure clean UTF-8 LF
            const raw = fs.readFileSync('public/greek_anki.csv');
            const fixed = raw.toString('utf8').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            fs.writeFileSync('public/greek_anki.csv', fixed, 'utf8');
            console.log('CSV fixed. First line:', fixed.split('\n')[0]);
            console.log('Line 2:', fixed.split('\n')[1]);
            // Set homepage for GitHub Pages build
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.homepage = 'https://hebidarkor.github.io/flashcards';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Build React app for GitHub Pages
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          force_orphan: true
          # Ensure .nojekyll so GitHub serves all files as-is
          enable_jekyll: false
